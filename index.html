<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexbord</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <!-- Startmenu -->
  <section id="screen-menu" class="screen">
    <h1 class="title">Hexbord</h1>
    <div class="menu">
      <button id="btn-new" type="button">Nieuw spel</button>
      <button id="btn-solo" type="button" class="secondary">Bord zonder telefoons</button>
      <button type="button" class="secondary btn-fullscreen">Fullscreen</button>
    </div>
  </section>

  <!-- Lobby -->
  <section id="screen-lobby" class="screen hidden">
    <h2>Join met je telefoon</h2>
    <div class="lobby-grid">
      <div id="qr" class="qr"></div>
      <div class="lobby-info">
        <p class="muted">Scan de QR-code of open <span id="join-url"></span> en vul in:</p>
        <p id="room-code" class="room-code">····</p>
        <ul class="slots">
          <li id="slot-links" class="slot"><span>Links</span><span class="slot-state">wachten…</span></li>
          <li id="slot-rechts" class="slot"><span>Rechts</span><span class="slot-state">wachten…</span></li>
        </ul>
      </div>
    </div>
    <p id="lobby-status" class="lobby-status"></p>
    <div class="menu row">
      <button id="btn-back" type="button" class="secondary">Terug</button>
      <button id="btn-start" type="button" disabled>Nu starten</button>
    </div>
  </section>

  <!-- Spel -->
  <main id="table" class="hidden">
    <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

    <section class="player-panel corner-tl" data-player="0"></section>
    <section class="player-panel corner-tr" data-player="1"></section>
    <section class="player-panel corner-bl" data-player="2"></section>
    <section class="player-panel corner-br" data-player="3"></section>

    <!-- Zijmenu: schuift uit als de muis de linkerrand raakt -->
    <nav id="side-menu" class="side-menu" aria-label="Spelmenu">
      <p class="side-menu-title">Menu</p>
      <button id="btn-home" type="button">Hoofdmenu</button>
      <button type="button" class="btn-fullscreen">Fullscreen</button>
      <button id="btn-debug" type="button">Coördinaten</button>
    </nav>

    <!-- Bevestiging: terug naar hoofdmenu -->
    <div id="confirm-home" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal">
        <h3 id="confirm-title">Terug naar het hoofdmenu?</h3>
        <p>Het potje stopt en de telefoons worden losgekoppeld.</p>
        <div class="modal-actions">
          <button id="btn-confirm-cancel" type="button" class="secondary">Annuleren</button>
          <button id="btn-confirm-home" type="button" class="danger">Ja, stop het potje</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/hex.js?v=5"></script>
  <script src="js/board.js?v=5"></script>
  <script src="js/lobby.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
