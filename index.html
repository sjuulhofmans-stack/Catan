<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De kolonisten van Gennep</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
  <canvas id="sea" aria-hidden="true"></canvas>

  <!-- Startmenu -->
  <section id="screen-menu" class="screen">
    <h1 class="title"><span class="title-small">De kolonisten van</span>Gennep</h1>
    <div class="menu">
      <button id="btn-new" type="button">Nieuw spel</button>
      <button id="btn-solo" type="button" class="secondary">Testbord</button>
      <button type="button" class="secondary btn-fullscreen">Fullscreen</button>
    </div>
  </section>

  <!-- Instellingen -->
  <section id="screen-settings" class="screen hidden">
    <h2>Instellingen</h2>
    <div class="settings">
      <div class="setting-row">
        <span class="setting-label">Aantal spelers</span>
        <div id="player-count" class="segmented">
          <button type="button" data-count="2">2</button>
          <button type="button" data-count="3">3</button>
          <button type="button" data-count="4">4</button>
        </div>
      </div>

      <div id="seat-map" class="seat-map">
        <div class="seat" data-seat="tl"></div>
        <div class="seat" data-seat="tr"></div>
        <div class="seat-board">bord</div>
        <div class="seat" data-seat="bl"></div>
        <div class="seat" data-seat="br"></div>
      </div>
      <p id="seat-hint" class="hint"></p>

      <div class="setting-row">
        <span class="setting-label">Timer per beurt</span>
        <label class="toggle"><input id="timer-on" type="checkbox"> Met timer</label>
        <select id="timer-seconds">
          <option value="30">0:30</option>
          <option value="45">0:45</option>
          <option value="60">1:00</option>
          <option value="90">1:30</option>
          <option value="120">2:00</option>
          <option value="180">3:00</option>
          <option value="240">4:00</option>
          <option value="300">5:00</option>
        </select>
      </div>

      <div class="setting-row">
        <span class="setting-label">Punten om te winnen</span>
        <input id="target-points" type="range" min="10" max="30" step="1">
        <output id="target-points-value" for="target-points"></output>
      </div>
    </div>
    <div class="menu row">
      <button id="btn-settings-back" type="button" class="secondary">Terug</button>
      <button id="btn-settings-next" type="button">Verder naar lobby</button>
    </div>
  </section>

  <!-- Lobby -->
  <section id="screen-lobby" class="screen hidden">
    <h2>Join met je telefoon</h2>
    <div class="lobby-grid">
      <div id="qr" class="qr"></div>
      <div class="lobby-info">
        <p class="muted">Scan de QR-code of open <span id="join-url"></span> en vul in:</p>
        <p id="room-code" class="room-code">····</p>
        <ul class="slots">
          <li id="slot-links" class="slot"><span>Links</span><span class="slot-state">wachten…</span></li>
          <li id="slot-rechts" class="slot"><span>Rechts</span><span class="slot-state">wachten…</span></li>
        </ul>
      </div>
    </div>
    <p id="lobby-status" class="lobby-status"></p>
    <div class="menu row">
      <button id="btn-back" type="button" class="secondary">Terug</button>
      <button id="btn-start" type="button" disabled>Nu starten</button>
    </div>
  </section>

  <!-- Spel -->
  <main id="table" class="hidden">
    <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

    <section class="player-panel corner-tl" data-seat="tl"></section>
    <section class="player-panel corner-tr" data-seat="tr"></section>
    <section class="player-panel corner-bl" data-seat="bl"></section>
    <section class="player-panel corner-br" data-seat="br"></section>

    <!-- Zijmenu: schuift uit als de muis de linkerrand raakt -->
    <nav id="side-menu" class="side-menu" aria-label="Spelmenu">
      <p class="side-menu-title">Menu</p>
      <button id="btn-home" type="button">Hoofdmenu</button>
      <button type="button" class="btn-fullscreen">Fullscreen</button>
      <button id="btn-debug" type="button">Coördinaten</button>
    </nav>

    <!-- Bevestiging: terug naar hoofdmenu -->
    <div id="confirm-home" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal">
        <h3 id="confirm-title">Terug naar het hoofdmenu?</h3>
        <p>Het potje stopt en de telefoons worden losgekoppeld.</p>
        <div class="modal-actions">
          <button id="btn-confirm-cancel" type="button" class="secondary">Annuleren</button>
          <button id="btn-confirm-home" type="button" class="danger">Ja, stop het potje</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Testbord: telefoonknop onderin het midden -->
    <div id="test-controls" class="test-controls" hidden>
      <p id="test-turn" class="test-turn"></p>
      <button id="btn-test-action" type="button">Dobbelen</button>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/hex.js?v=15"></script>
  <script src="js/board.js?v=15"></script>
  <script src="js/sea.js?v=15"></script>
  <script src="js/lobby.js?v=15"></script>
  <script src="js/settings.js?v=15"></script>
  <script src="js/main.js?v=15"></script>
</body>
</html>
