<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>De kolonisten van Gennep – telefoon</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/controller.css?v=11">
</head>
<body>
  <main class="phone">
    <h1>De kolonisten van Gennep</h1>

    <section id="step-join" class="step">
      <label for="code">Roomcode</label>
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      <button id="btn-join" type="button">Join</button>
    </section>

    <section id="step-joined" class="step joined" hidden>
      <p class="side-label">Telefoon <span id="side"></span></p>
      <p id="turn-label" class="turn-label">Wachten tot het spel start…</p>
      <button id="btn-action" type="button" class="action" disabled>Wachten…</button>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/controller.js?v=11"></script>
</body>
</html>
